</svg><path d="M1170 279L1129 246" fill="none" stroke="#9b775f" stroke-width="2" /><text x="1011" y="237" font-size="15" fill="#9b775f" font-weight="400" text-anchor="start" >面板边界</text><text x="1173" y="757" font-size="15" fill="#8b9e9c" font-weight="500" text-anchor="start" letter-spacing="1">ornament-front</text><rect x="78" y="964" width="106" height="32" rx="5" fill="#edf0e4" stroke="#dae1cc" stroke-width="1" /><text x="91" y="986" font-size="15" fill="#6b7e56" font-weight="500" text-anchor="start" >根级装饰层</text><rect x="194" y="964" width="90" height="32" rx="5" fill="#edf0e4" stroke="#dae1cc" stroke-width="1" /><text x="207" y="986" font-size="15" fill="#6b7e56" font-weight="500" text-anchor="start" >允许越框</text><rect x="294" y="964" width="138" height="32" rx="5" fill="#edf0e4" stroke="#dae1cc" stroke-width="1" /><text x="307" y="986" font-size="15" fill="#6b7e56" font-weight="500" text-anchor="start" >装饰不拦截点击</text><text x="78" y="1034" font-size="17" fill="#6f7c61" font-weight="400" text-anchor="start" >长枪越过的是应用内面板；装饰随面板定位，仍受整个应用视口约束。</text><text x="1526" y="982" font-size="14" fill="#929d86" font-weight="400" text-anchor="end" >静态设计示意 · 非 MXU 实机截图</text></g></svg>